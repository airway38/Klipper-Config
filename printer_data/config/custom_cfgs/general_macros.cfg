###### LOAD AND UNLOAD FILAMENT FOR SINGLE FILAMENT SYSTEM
[gcode_macro FILAMENT_LOADING_VAR]
description: Pauses on runout or filament swap call, moves the printer head to the park position (M125), waits to initiate (M702), waits for load (M701), and then resumes the print (SWAP_RESUME).
variable_default_temp: 250	# Default temperature to heat up if M600 issued in terminal. Ignored if a target temperature is already set at launch ( M104 / M109 ) or started within a printjob
variable_load_new: 100 # mm to load filament (average length needed to purge out a totally different color)
variable_purge: 20 # Extract xx mm filament extra after loading if more purging is required to remove the old color
variable_unload: 120 # Total mm to unload filament (bowden tube length)
variable_unload_speed: 1000 # Speed at which filament is unloaded
variable_load_speed: 200 # Speed at which filament is loaded
variable_retract_park: 0.8 # Amount to retract on PAUSE to prevent oozing. Also used to as amount to extrude on RESUME
variable_temperature: 0

gcode:

[gcode_macro LOW_TEMP_CHECK]
gcode:
	{% if not params.OVERRIDE is defined %}
		  {% if params.T is defined %}
				{% set TMP=params.T|int%}
				{% if printer.configfile.config.extruder.max_temp is defined %}
					{% if params.T|int>printer.configfile.config.extruder.max_temp|int %}
						{% set TMP=printer["gcode_macro FILAMENT_LOADING_VAR"].default_temp|int %}
					{% endif %}
				{% endif %}
				{% if TMP|int==0 %}
				{% set TMP=printer["gcode_macro FILAMENT_LOADING_VAR"].default_temp|int %}
		  {% endif %}
	 {% else %}
		  {% set TMP=printer["gcode_macro FILAMENT_LOADING_VAR"].default_temp|int %}
		  {% if printer["gcode_macro FILAMENT_LOADING_VAR"].temperature|int > 0 %}
				{% set TMP=printer["gcode_macro FILAMENT_LOADING_VAR"].temperature %}
		  {% endif %}
	 {% endif %}
	 {% if printer.configfile.config.extruder.min_extrude_temp is defined %}
		  {% if TMP|int<printer.configfile.config.extruder.min_extrude_temp|int %}
				{% set TMP=printer["gcode_macro FILAMENT_LOADING_VAR"].default_temp %}
		  {% endif%}
	 {% endif %}
	 {% else %}
		  {% if params.T is defined %}
				{% set TMP=params.T|int %}
		  {% else %}
				{% set TMP=printer["gcode_macro FILAMENT_LOADING_VAR"].default_temp %}
		  {% endif %}
	 {% endif %}
	  # If extruder is hot enough/within -5 degrees celsius of the set temperature
	{% if (printer.extruder.temperature|int + 5) >= TMP|int %}
		M118 Hotend temperature is ok
		M104 S{TMP}
	{% else %}
		M118 Hotend needs to heat back up. Standby
		M109 S{TMP}
	{% endif %}


[gcode_macro UNLOAD_FILAMENT_EXTRUDER]
description: Unload the filament from the extruder.
gcode:
	# Check to see if the temp is lower than needed
	LOW_TEMP_CHECK

	# Commence unloading
	G91
	# Push 15mm to prevent end being deformed on unload
	G1 E15 F300
	# Unload
	G1 E-{printer["gcode_macro FILAMENT_LOADING_VAR"].unload|int} F{printer["gcode_macro FILAMENT_LOADING_VAR"].unload_speed|int}
	G92 E0.0
	G90
	
	M118 Unloading...
	
	G4 S{(printer["gcode_macro FILAMENT_LOADING_VAR"].unload|int / printer["gcode_macro FILAMENT_LOADING_VAR"].unload|int) * 60}
	
	M118 Filament unloading complete. Load new filament and run LOAD_FILAMENT 
	
[gcode_macro LOAD_FILAMENT_EXTRUDER]
description: Load the new filament into the toolhead.
gcode:
	M83
	G92 E0.0
	LOW_TEMP_CHECK
	
	{% if params.PURGE == true %}
			
		G1 E{printer["gcode_macro FILAMENT_LOADING_VAR"].purge|int} F{printer["gcode_macro FILAMENT_LOADING_VAR"].load_speed|int}
		
	{% else %}
		
		G1 E{printer["gcode_macro FILAMENT_LOADING_VAR"].load_new|int} F{printer["gcode_macro FILAMENT_LOADING_VAR"].load_speed|int}
		
	{% endif %}	

	# Retract a little to prevent ooze
	G1 E-{printer["gcode_macro FILAMENT_LOADING_VAR"].retract_park} F2100
	
	G92 E0.0
	
	M118 Loading filament...please wait
	
	G4 S{(printer["gcode_macro FILAMENT_LOADING_VAR"].load_new|int / printer["gcode_macro FILAMENT_LOADING_VAR"].load_speed|int) * 60}
	
	{% if print_state == "Printing" %} 
	
		{% if params.PURGE == true %}
		
			M118 Purge complete. If needed, run PURGE_FILAMENT again, or SWAP_RESUME if complete.
			
		{% else %}
		
			M118 Filament loading complete. If needed, run PURGE_FILAMENT, or SWAP_RESUME if swapping.
			
		{% endif %}	
		
	{% else %}
	
		{% if params.PURGE == true %}
		
			M118 Purge complete. If needed, run PURGE_FILAMENT again. 
			
		{% else %}
		
			M118 Filament loading complete. If needed, run PURGE_FILAMENT again.
			
		{% endif %}	
	
	{% endif %}	


[gcode_macro CALIBRATE_INPUT_SHAPER] 
description: Run input shaper on X axis only if ADXL installed
gcode:
	C_G28
	SHAPER_CALIBRATE



[gcode_macro C_G28] 
description: Only homes if not already homed
gcode:
	# Reset the LEDs and display back to the original settings in case the machine has gone to idle
	LED_STATUS_AWAKE

	# Turn the lights on
	CASE_LIGHTS_ON
	
  {% if "xyz" not in printer.toolhead.homed_axes %}
  
	 LED_STATUS_HOMING                                     # set Stealth Burner LEDs to HOMING
	 #CUSTOM_DISPLAY_MESSAGE MESSAGE='homing_axis'
	 SET_DISPLAY_TEXT MSG="Homing axis"
	 M118 Homing axis
	 
	 G28                                              		# home all
	 
	 LED_STATUS_INITIAL                                     # set Stealth Buner LEDs to READY
	 #CLEAR_DISPLAY_MESSAGE
	 SET_DISPLAY_TEXT MSG="Homing complete"
	 M118 Homing complete
	 
	 G1 X150 Y150 Z5
	 
  {% endif %}

[gcode_macro M300] # Beeper
gcode:  
	{% set S = params.S|default(1000)|int %} # S sets the tone frequency
	{% set P = params.P|default(100)|int %} # P sets the tone duration
	{% set L = 0.5 %} # L varies the PWM on time, close to 0 or 1 the tone gets a bit quieter. 0.5 is a symmetric waveform
	
	{% if S <= 0 %} # dont divide through zero
		{% set F = 1 %}
		{% set L = 0 %}
	{% elif S >= 10000 %} #max frequency set to 10kHz
		{% set F = 0 %}
	{% else %}
		{% set F = 1/S %} #convert frequency to seconds 
	{% endif %}
	
	SET_PIN PIN=beeper_pin VALUE={L} CYCLE_TIME={F} ;Play tone
		G4 P{P} #tone duration
	SET_PIN PIN=beeper_pin VALUE=0

[gcode_macro PID_TUNE_EXTRUDER]
gcode:

	{% set target_pid = params.TARGET|default(250)|int %}
	{% set target_fanspeed = params.TARGET_FAN_SPEED|default(0)|int %}
	
	M106 S{(target_fanspeed / 100 ) * 255}
	PID_CALIBRATE HEATER=extruder TARGET={target_pid}
	
	# While the temperature of the hotend is above 60, then keep it in cooling mode
	# Check every 5 seconds for the temperature of the bed
	{% set DELAY = params.DELAY|default(5*1)|int %} 

	SET_DISPLAY_TEXT MSG="Waiting to cooldown before restarting"
	M118 Waiting to cooldown before restarting
	
	UPDATE_DELAYED_GCODE ID=COOLDOWN_WAIT DURATION={DELAY}
	

[gcode_macro CHECK_TEMP]
gcode:
    {% set DELAY = params.DELAY|default(5*1)|int %}
	
	UPDATE_DELAYED_GCODE ID=COOLDOWN_WAIT DURATION={DELAY}

[delayed_gcode COOLDOWN_WAIT]
initial_duration: 0.0
gcode:
	# If the bed temp is above 60, then bed is still too warm. Keep it in cooldown mode
    {% if printer.extruder.temperature > 60 %} 
	
        CHECK_TEMP 
		
    {% else %}
		
		SAVE_CONFIG
		
	{% endif %}

[gcode_macro PID_TUNE_BED]
gcode:

	{% set target_pid = params.TARGET|default(80)|int %}

	PID_CALIBRATE HEATER=heater_bed TARGET={target_pid}
	
	SAVE_CONFIG
	
	
	
  
