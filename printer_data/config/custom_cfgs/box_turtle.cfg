[gcode_macro BT_SET_MATERIAL] 
description: Set the material per lane
gcode:
	{% set target_lane = params.TARGET_LANE|string %}
	{% set material_set = params.MATERIAL_SELECT|default("ABS")|string %}
	
	SET_MATERIAL LANE={target_lane} MATERIAL={material_set}
	
[gcode_macro BT_AUTO_CALIBRATION] 
description: Run the GUI calibration
gcode:
	AFC_CALIBRATION
	
[gcode_macro BT_STATUS] 
description: Check the status of the lanes and hub
gcode:		
	AFC_STATUS
	
[gcode_macro BT_CHANGE_LANE] 
description: Swap the filament from one lane to another
gcode:		
	{% set new_lane = params.NEW_LANE|string %}
	
	CHANGE_TOOL LANE={new_lane}
	
[gcode_macro BT_UNLOAD_TOOL] 
description: Unload the filament from the toolhead
gcode:	
	{% set target_lane = params.TARGET_LANE|string %}
	
	TOOL_UNLOAD LANE={target_lane}
	
[gcode_macro BT_LOAD_TOOL] 
description: Load the filament to the toolhead
gcode:	
	{% set target_lane = params.TARGET_LANE|string %}
	
	TOOL_LOAD LANE={target_lane}
	
[gcode_macro BT_UNLOAD_LANE] 
description: Unload the filament from the lane
gcode:	
	{% set target_lane = params.TARGET_LANE|string %}
	
	LANE_UNLOAD LANE={target_lane}
	
[gcode_macro BT_LOAD_HUB] 
description: Load the filament to the hub
gcode:	
	{% set target_lane = params.TARGET_LANE|string %}
	
	HUB_LOAD LANE={target_lane}
	
[gcode_macro BT_SET_RUNOUT] 
description: Load the filament to the hub
gcode:	
	{% set monitored_lane = params.MONITOR_LANE|string %}
	{% set replacement_lane = params.REPLACE_LANE|string %}
	
	SET_RUNOUT LANE={monitored_lane} RUNOUT={replacement_lane}